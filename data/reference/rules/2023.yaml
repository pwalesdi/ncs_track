    topic: MOC fill spots
    values:
      moc_guide: 3, all four meets
      nbl_flyer: 6, three Areas (omits Class A)
    default: moc_guide
    status: open
  D2:
    topic: Redwood Empire fill (league -> area)
    values:
      official_sheet: 6-10
      nbl_flyer: 10
    default: null
    status: open
  D3:
    topic: League -> Area at-large standards for Tri-Valley, Bay Shore, Redwood Empire
    values:
      referenced: plus any at-large marks
      table: not in hand
    also: Bay Shore area sheet omits at-large entirely; Class A guide summary includes it
    status: open
  D4:
    topic: Berean Christian's league
    values:
      text: DVAL
      list_header: DAL
    status: open
  D5:
    topic: '"Equal entries" rule vs 4/6/6 split (Tri-Valley, Bay Shore)'
    values:
      rule: equal entries from each league
      base_split: 4/6/6
    probable_reading: applies to redistribution only
    status: open
  D6:
    topic: Wind legality of at-large marks
    values:
      documents: unspecified
    handling: flag wind-aided marks, never exclude
    status: open
  D7:
    topic: Earlier seasons (2019, 2022-2025)
    values:
      rules_in_hand:
      - 2026
      standards_in_hand: []
    handling: standards and allocations assumed from 2026
    status: open
  D8:
    topic: MOC at-large eligibility wording vs Class A auto spots
    values:
      at_large_text: outside the top 6
      class_a_auto: 3
    note: Added during YAML transcription; not in the source doc's discrepancy list.
    status: open
  D9:
    topic: State at-large standards table
    values:
      source_doc: '[inference] same table as Area->MOC'
      hytek_results: 2019, 2022, 2024 and 2025 MOC Hy-Tek files print separate "CIF At-Large" lines whose
        marks are much stricter than the NCS at-large marks and change by season (see docs/rules/standards_crosscheck.md).
        The inference looks wrong.
    note: Added during YAML transcription; not in the source doc's discrepancy list.
    status: open
