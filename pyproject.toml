[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-track"
version = "0.1.0"
description = "NCS track & field Meet of Champions qualification analysis"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ncs-track = "ncs_track.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
